app = "citero-api"
primary_region = "gru"

[build]

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  PORT = "8080"
  JAVA_OPTS = "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
