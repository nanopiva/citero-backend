spring.application.name=citero

# Carga variables locales desde el archivo .env (mecanismo nativo de Spring).
# En producción (sin .env) se usan las variables de entorno reales.
# Ningún valor sensible debe quedar hardcodeado en este archivo.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Base de datos (PostgreSQL). Definir DB_URL, DB_USERNAME, DB_PASSWORD y
# DB_DRIVER en el entorno.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citero}
spring.datasource.username=${DB_USERNAME:citero}
spring.datasource.password=${DB_PASSWORD:citero}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Pool de conexiones (Hikari). Falla rápido ante agotamiento en vez de colgarse.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_MS:20000}

# Configuración de JPA/Hibernate. El esquema lo gestiona Flyway (db/migration) y
# Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
# Cierra la sesión al salir del servicio (evita lazy loading fuera de transacción).
spring.jpa.open-in-view=false

# Rechaza propiedades desconocidas en el JSON de entrada (evita mass assignment por
# campos no mapeados en el DTO). Ver los DTOs con allowlist explícita de campos.
spring.jackson.deserialization.fail-on-unknown-properties=true

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG:WARN}

# Puerto del servidor (Railway/Heroku inyectan PORT; en local usa 8080)
server.port=${PORT:8080}

# Incluye el id de correlación (MDC) en cada línea de log para poder rastrear un request.
logging.pattern.level=%5p [%X{requestId:-}]

# La IP real del cliente se resuelve en ClientIpResolver a partir de X-Forwarded-For.
# Se usa "none" para poder leer el header crudo: el ForwardedHeaderFilter de Spring lo
# elimina y solo deja un getRemoteAddr() ya parseado (left-most, falsificable).
server.forward-headers-strategy=none

# Tomcat: acota concurrencia para amortiguar floods a nivel de servidor.
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:150}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN:10}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:4000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:10s}

# Actuator: se expone solo health/info (usado por el HEALTHCHECK del Dockerfile).
management.endpoints.web.exposure.include=health,info

# Swagger/OpenAPI deshabilitado por defecto (se habilita sólo en el perfil dev).
# Así no queda expuesto aunque producción no active el perfil prod.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ---------------------------------------------------------------------------
# URLs del Frontend para construir links en emails
# ---------------------------------------------------------------------------
citero.frontend.url=${CITERO_FRONTEND_URL:http://localhost:3000}
citero.frontend.dashboard.url=${CITERO_FRONTEND_DASHBOARD_URL:http://localhost:3000/dashboard}

# ---------------------------------------------------------------------------
# JWT Configuration
# ---------------------------------------------------------------------------
citero.jwt.secret=${CITERO_JWT_SECRET}
# Emisor y audiencia esperados en los access tokens (defensa en profundidad).
citero.jwt.issuer=${CITERO_JWT_ISSUER:citero}
citero.jwt.audience=${CITERO_JWT_AUDIENCE:citero-app}

# Access token (JWT) de vida corta; el refresh token (cookie HttpOnly) es el de larga vida
citero.auth.access-token-ttl-ms=${CITERO_ACCESS_TOKEN_TTL_MS:900000}
citero.auth.refresh-token-ttl-ms=${CITERO_REFRESH_TOKEN_TTL_MS:2592000000}

# Lockout temporal de login por cuenta (anti fuerza bruta). El reseteo de contraseña lo limpia.
citero.auth.lockout.max-failures=${CITERO_LOGIN_LOCKOUT_MAX_FAILURES:5}
citero.auth.lockout.failure-window-minutes=${CITERO_LOGIN_LOCKOUT_FAILURE_WINDOW_MINUTES:15}
citero.auth.lockout.lock-minutes=${CITERO_LOGIN_LOCKOUT_LOCK_MINUTES:15}

# MFA (TOTP): nombre mostrado en la app de autenticación, dígitos y vida del desafío de login.
citero.auth.mfa.issuer=${CITERO_MFA_ISSUER:Citero}
citero.auth.mfa.digits=${CITERO_MFA_DIGITS:6}
citero.auth.mfa.challenge-ttl-ms=${CITERO_MFA_CHALLENGE_TTL_MS:300000}

# Chequeo de contraseñas filtradas (HIBP k-Anonymity). Fail-open ante caída del servicio.
citero.security.hibp.enabled=${HIBP_ENABLED:true}

# Secreto (pepper) para hashear los OTP en reposo (HMAC-SHA256). Se recomienda un secreto
# dedicado; si no se define, se reutiliza el del JWT para no romper el arranque.
citero.otp.secret=${CITERO_OTP_SECRET:${citero.jwt.secret}}
# Loggear el código OTP en claro (sólo para desarrollo local; nunca en producción).
citero.otp.log-code=${CITERO_OTP_LOG_CODE:false}

# Token firmado para los links públicos de gestión de turnos (email).
# Si no se define un secreto dedicado, se usa el mismo que el JWT (cero configuración).
citero.public-link.secret=${CITERO_PUBLIC_LINK_SECRET:${citero.jwt.secret}}
# Validez del link contada desde la hora de inicio del turno (por defecto 30 días).
citero.public-link.grace-hours=${CITERO_PUBLIC_LINK_GRACE_HOURS:720}

# Cookie del refresh token
citero.auth.cookie.name=${CITERO_COOKIE_NAME:citero_refresh}
citero.auth.cookie.secure=${CITERO_COOKIE_SECURE:true}
citero.auth.cookie.same-site=${CITERO_COOKIE_SAME_SITE:Lax}
citero.auth.cookie.domain=${CITERO_COOKIE_DOMAIN:}
citero.auth.cookie.path=${CITERO_COOKIE_PATH:/api/auth}

# CORS (orígenes permitidos, separados por coma). También se usan para validar
# Origin/Referer (anti-CSRF) en los endpoints con cookie. Obligatorio: sin la
# variable la app no arranca (evita permitir un origen de desarrollo en prod).
# El perfil dev/test lo define explícitamente.
citero.cors.allowed-origins=${CITERO_CORS_ALLOWED_ORIGINS}

# Rate limiting
# Proxies de confianza delante de la app para tomar la IP real desde X-Forwarded-For.
# 1 = un único edge/proxy (Railway/Heroku). 0 = no confiar en el header (usa remoteAddr).
citero.rate-limit.trusted-proxy-hops=${CITERO_RATE_LIMIT_TRUSTED_PROXY_HOPS:1}

# Caps agregados globales (no por IP): acotan el total del sistema ante floods distribuidos.
citero.rate-limit.availability-global-per-minute=${RATE_LIMIT_AVAILABILITY_GLOBAL_PER_MIN:1200}
citero.rate-limit.booking-global-per-minute=${RATE_LIMIT_BOOKING_GLOBAL_PER_MIN:500}

# Backstop de memoria de los stores en memoria (rate limiting + lockout): máximo de claves.
# Al superarlo se rechazan claves nuevas hasta que la limpieza (cada 60s) libere las vencidas.
citero.rate-limit.max-keys=${RATE_LIMIT_MAX_KEYS:100000}

# Bulkhead de concurrencia (operaciones caras), independiente de la IP.
citero.concurrency.availability.max=${CONCURRENCY_AVAILABILITY_MAX:20}
citero.concurrency.booking.max=${CONCURRENCY_BOOKING_MAX:10}

# ---------------------------------------------------------------------------
# Ejecución asíncrona (envío de emails). Cola ACOTADA: al saturarse, el task corre
# en el hilo llamador (backpressure) en vez de acumularse sin límite y provocar OOM.
# ---------------------------------------------------------------------------
spring.task.execution.pool.core-size=${ASYNC_CORE_POOL_SIZE:4}
spring.task.execution.pool.max-size=${ASYNC_MAX_POOL_SIZE:8}
spring.task.execution.pool.queue-capacity=${ASYNC_QUEUE_CAPACITY:200}
spring.task.execution.thread-name-prefix=citero-async-

# ---------------------------------------------------------------------------
# Resend (envío de emails)
# ---------------------------------------------------------------------------
resend.api.key=${RESEND_API_KEY}
citero.email.from=${CITERO_EMAIL_FROM:noreply@citero.app}

# Reintentos de envío de emails ante fallos de Resend
citero.email.retry.max-attempts=${CITERO_EMAIL_RETRY_MAX_ATTEMPTS:3}
citero.email.retry.backoff-ms=${CITERO_EMAIL_RETRY_BACKOFF_MS:1000}

# Habilita o deshabilita globalmente el proceso de envío de recordatorios
citero.reminder.scheduler.enabled=${CITERO_REMINDER_SCHEDULER_ENABLED:true}

# ---------------------------------------------------------------------------
# Cloudinary (subida de imágenes)
# ---------------------------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:citero}

# ---------------------------------------------------------------------------
# Límites de subida de archivos (multipart)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:2MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:3MB}
