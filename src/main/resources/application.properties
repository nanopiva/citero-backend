spring.application.name=citero

# Carga variables locales desde el archivo .env (mecanismo nativo de Spring).
# En producción (sin .env) se usan las variables de entorno reales.
# Ningún valor sensible debe quedar hardcodeado en este archivo.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Base de datos (PostgreSQL). Definir DB_URL, DB_USERNAME, DB_PASSWORD y
# DB_DRIVER en el entorno.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citero}
spring.datasource.username=${DB_USERNAME:citero}
spring.datasource.password=${DB_PASSWORD:citero}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Configuración de JPA/Hibernate. El esquema lo gestiona Flyway (db/migration) y
# Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG:WARN}

# Puerto del servidor (Railway/Heroku inyectan PORT; en local usa 8080)
server.port=${PORT:8080}

# Detrás de un proxy (Railway/Heroku) resuelve la IP real del cliente desde
# X-Forwarded-For, necesaria para el rate limiting y la auditoría.
server.forward-headers-strategy=framework

# Actuator: se expone solo health/info (usado por el HEALTHCHECK del Dockerfile).
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------------
# URLs del Frontend para construir links en emails
# ---------------------------------------------------------------------------
citero.frontend.url=${CITERO_FRONTEND_URL:http://localhost:3000}
citero.frontend.dashboard.url=${CITERO_FRONTEND_DASHBOARD_URL:http://localhost:3000/dashboard}

# ---------------------------------------------------------------------------
# JWT Configuration
# ---------------------------------------------------------------------------
citero.jwt.secret=${CITERO_JWT_SECRET}

# Access token (JWT) de vida corta; el refresh token (cookie HttpOnly) es el de larga vida
citero.auth.access-token-ttl-ms=${CITERO_ACCESS_TOKEN_TTL_MS:900000}
citero.auth.refresh-token-ttl-ms=${CITERO_REFRESH_TOKEN_TTL_MS:2592000000}

# Cookie del refresh token
citero.auth.cookie.name=${CITERO_COOKIE_NAME:citero_refresh}
citero.auth.cookie.secure=${CITERO_COOKIE_SECURE:true}
citero.auth.cookie.same-site=${CITERO_COOKIE_SAME_SITE:Lax}
citero.auth.cookie.domain=${CITERO_COOKIE_DOMAIN:}
citero.auth.cookie.path=${CITERO_COOKIE_PATH:/api/auth}

# CORS (orígenes permitidos, separados por coma)
citero.cors.allowed-origins=${CITERO_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------------------
# Resend (envío de emails)
# ---------------------------------------------------------------------------
resend.api.key=${RESEND_API_KEY}
citero.email.from=${CITERO_EMAIL_FROM:noreply@citero.app}

# Reintentos de envío de emails ante fallos de Resend
citero.email.retry.max-attempts=${CITERO_EMAIL_RETRY_MAX_ATTEMPTS:3}
citero.email.retry.backoff-ms=${CITERO_EMAIL_RETRY_BACKOFF_MS:1000}

# Habilita o deshabilita globalmente el proceso de envío de recordatorios
citero.reminder.scheduler.enabled=${CITERO_REMINDER_SCHEDULER_ENABLED:true}

# ---------------------------------------------------------------------------
# Cloudinary (subida de imágenes)
# ---------------------------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:citero}

# ---------------------------------------------------------------------------
# Límites de subida de archivos (multipart)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:5MB}
