# =============================================================================
# Perfil de producción. Activar con SPRING_PROFILES_ACTIVE=prod.
# Configuración segura: sin consola H2, sin Swagger, sin logs sensibles.
# =============================================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Sin consola H2 ni Swagger público.
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# La cookie de refresh viaja solo por HTTPS.
citero.auth.cookie.secure=true

# Errores sin filtrar información interna (stacktrace, mensaje, excepciones, campos).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Railway termina TLS y la app ve HTTP: forzar el header HSTS en las respuestas.
citero.security.hsts.force=true
