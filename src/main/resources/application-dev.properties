# =============================================================================
# Perfil de desarrollo local. Activar con SPRING_PROFILES_ACTIVE=dev.
# H2 en memoria + consola H2. NO usar en producción.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:citero_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Logs verbosos solo en dev (en producción no deben filtrarse binds con hashes ni OTPs).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Consola H2 (solo dev).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger/OpenAPI habilitado en dev.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# En local no hay HTTPS: la cookie de refresh no exige Secure.
citero.auth.cookie.secure=false

# Valores dummy SOLO para desarrollo local.
# El JWT NO tiene default: debe venir de CITERO_JWT_SECRET (en local, del archivo .env
# que no se versiona). Ver .env.example. Si falta, la app no arranca (fail-fast).
resend.api.key=dev-dummy
# Cloudinary usa los valores reales del .env si están definidos; si no, cae en dummy
# (con dummy, la subida de imágenes devuelve 500). El .env no se versiona.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dev-dummy}
cloudinary.api-key=${CLOUDINARY_API_KEY:dev-dummy}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dev-dummy}
