# Configuración exclusiva de tests: H2 en memoria y valores dummy, sin depender
# de un archivo .env ni de una base de datos externa.
spring.datasource.url=jdbc:h2:mem:citero_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop

# Los tests generan el esquema con Hibernate (create-drop); no aplican migraciones.
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

citero.jwt.secret=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYQ==

resend.api.key=test-resend-key
citero.email.from=noreply@test.com
citero.reminder.scheduler.enabled=false

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
cloudinary.folder=citero-test

citero.frontend.url=http://localhost:3000
citero.frontend.dashboard.url=http://localhost:3000/dashboard
citero.cors.allowed-origins=http://localhost:3000

citero.auth.cookie.secure=false
citero.auth.cookie.same-site=Lax

# El rate limiting se prueba de forma aislada en RateLimitFilterTest.
citero.rate-limit.enabled=false
